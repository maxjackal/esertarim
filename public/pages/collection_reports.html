<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tahsilat Raporu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/supabase_client.js"></script>
    <script src="/assets/js/auth_guard.js"></script>
    <script src="/assets/js/api_service.js"></script>
</head>

<body data-page-title="Tahsilat Raporu" class="bg-slate-50 text-slate-800">
    <div class="app-shell">
        <div class="app-layout">
            <div id="sidebarMount" class="app-sidebar-wrap"></div>

            <main class="app-main">
                <div id="topbarMount"></div>

                <div class="app-content">
                    <div class="mx-auto max-w-7xl px-4 py-6">
                        <div class="mb-6">
                            <h1 class="text-2xl font-bold text-slate-900">Tahsilat Raporu</h1>
                            <p class="mt-1 text-sm text-slate-500">
                                Alınan ödemeleri filtreleyin, görüntüleyin ve CSV olarak dışa aktarın.
                            </p>
                        </div>

                        <section class="mb-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                            <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-6">
                                <fieldset class="d360-field">
                                    <legend>Başlangıç Tarihi</legend>
                                    <input id="fromDate" type="date" class="d360-input" />
                                </fieldset>

                                <fieldset class="d360-field">
                                    <legend>Bitiş Tarihi</legend>
                                    <input id="toDate" type="date" class="d360-input" />
                                </fieldset>

                                <fieldset class="d360-field">
                                    <legend>Ödeme Yöntemi</legend>
                                    <select id="paymentMethodFilter" class="d360-select">
                                        <option value="">Tümü</option>
                                        <option value="cash">Nakit</option>
                                        <option value="bank">Banka</option>
                                        <option value="card">Kart</option>
                                    </select>
                                </fieldset>

                                <fieldset class="d360-field relative">
                                    <legend>Satıcı</legend>

                                    <input id="sellerSearch" type="text" class="d360-input"
                                        placeholder="Satıcı adı yazın" autocomplete="off" />

                                    <input id="sellerId" type="hidden" />

                                    <div id="sellerDropdown"
                                        class="absolute left-0 right-0 top-[calc(100%+8px)] z-30 hidden max-h-64 overflow-y-auto rounded-2xl border border-slate-200 bg-white p-2 shadow-xl">
                                    </div>
                                </fieldset>

                                <fieldset class="d360-field">
                                    <legend>Alıcı</legend>
                                    <select id="buyerFilter" class="d360-select">
                                        <option value="">Tümü</option>
                                    </select>
                                </fieldset>

                                <fieldset class="d360-field">
                                    <legend>Ürün</legend>
                                    <select id="productFilter" class="d360-select">
                                        <option value="">Tümü</option>
                                    </select>
                                </fieldset>
                            </div>

                            <div class="mt-4 flex flex-wrap gap-2">
                                <button id="filterBtn"
                                    class="rounded-xl bg-slate-900 px-4 py-3 text-sm font-semibold text-white hover:bg-slate-800">
                                    Filtrele
                                </button>

                                <button id="clearBtn"
                                    class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50">
                                    Temizle
                                </button>

                                <button id="exportBtn"
                                    class="rounded-xl bg-emerald-600 px-4 py-3 text-sm font-semibold text-white hover:bg-emerald-700">
                                    Excel İndir
                                </button>
                            </div>
                        </section>

                        <section class="mb-6 grid grid-cols-1 gap-4 md:grid-cols-2">
                            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                                <p class="text-sm text-slate-500">Kayıt Sayısı</p>
                                <p id="totalCount" class="mt-2 text-3xl font-bold text-slate-900">0</p>
                            </div>

                            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                                <p class="text-sm text-slate-500">Toplam Tahsilat</p>
                                <p id="totalAmount" class="mt-2 text-3xl font-bold text-emerald-600">0 ₺</p>
                            </div>
                        </section>

                        <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                            <div class="overflow-x-auto">
                                <table class="min-w-full text-sm">
                                    <thead>
                                        <tr class="border-b border-slate-200 text-left text-slate-500">
                                            <th class="py-3 pr-4">Ödeme Tarihi</th>
                                            <th class="py-3 pr-4">Satıcı</th>
                                            <th class="py-3 pr-4">Alıcı</th>
                                            <th class="py-3 pr-4">Ürün</th>
                                            <th class="py-3 pr-4">Tutar</th>
                                            <th class="py-3 pr-4">Yöntem</th>
                                            <th class="py-3 pr-4">Açıklama</th>
                                            <th class="py-3 pr-4">İşlem Yapan</th>
                                        </tr>
                                    </thead>
                                    <tbody id="reportTableBody"></tbody>
                                </table>
                            </div>
                        </section>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="/assets/js/toast.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/pages/collection-reports.js"></script>
</body>

</html>
