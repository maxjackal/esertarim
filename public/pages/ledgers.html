<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Defterler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/supabase_client.js"></script>
    <script src="/assets/js/api_service.js"></script>
</head>

<body data-page-title="Defterler" class="bg-slate-50 text-slate-800">
    <div class="app-shell">
        <div class="app-layout">
            <div id="sidebarMount" class="app-sidebar-wrap"></div>
                <main class="app-main">
                    <div id="topbarMount"></div>
                    <div class="app-content">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="mb-6">
                <h1 class="text-2xl font-bold">Defterler</h1>
                <p class="text-sm text-slate-500 mt-1">Alıcı ve ürün bazlı oluşan tüm defterleri görüntüleyin.</p>
            </div>
        
            <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <fieldset class="d360-field">
                        <legend>Alıcı</legend>
                        <select id="buyerFilter" class="d360-select">
                            <option value="">Tümü</option>
                        </select>
                    </fieldset>
        
                    <fieldset class="d360-field">
                        <legend>Ürün</legend>
                        <select id="productFilter" class="d360-select">
                            <option value="">Tümü</option>
                        </select>
                    </fieldset>
        
                    <div class="flex items-end">
                        <button id="filterBtn"
                            class="rounded-xl bg-slate-900 px-4 py-3 text-sm font-semibold text-white hover:bg-slate-800">
                            Filtrele
                        </button>
                    </div>
                </div>
            </section>
        
            <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
                <div class="overflow-x-auto">
                    <table class="min-w-full text-sm">
                        <thead>
                            <tr class="border-b border-slate-200 text-left text-slate-500">
                                <th class="py-3 pr-4">Alıcı</th>
                                <th class="py-3 pr-4">Ürün</th>
                                <th class="py-3 pr-4">Kayıt</th>
                                <th class="py-3 pr-4">Kasa</th>
                                <th class="py-3 pr-4">Kilo</th>
                                <th class="py-3 pr-4">Toplam</th>
                                <th class="py-3 pr-4">Kalan</th>
                                <th class="py-3 pr-4">Son Tarih</th>
                                <th class="py-3 pr-4">İşlem</th>
                            </tr>
                        </thead>
                        <tbody id="ledgerTableBody"></tbody>
                    </table>
                </div>
            </section>
       
                    </div>
                </main>
            </div>
        </div>
    </div>


    <script src="/assets/js/pages/ledgers.js"></script>
    <script src="/assets/js/toast.js"></script>
    <script src="/assets/js/layout.js"></script>
    
</body>

</html>
