<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satıcı Raporu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/supabase_client.js"></script>
    <script src="/assets/js/api_service.js"></script>
</head>

<body data-page-title="Raporlar" class="bg-slate-50 text-slate-800">
    <div class="app-shell">
        <div class="app-layout">
            <div id="sidebarMount" class="app-sidebar-wrap"></div>
                <main class="app-main">
                    <div id="topbarMount"></div>
                    <div class="app-content">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
                <div>
                    <h1 class="text-2xl font-bold">Satıcı Raporu</h1>
                    <p class="text-sm text-slate-500 mt-1">Satıcının sattığı ürünleri ve toplamlarını görüntüleyin.</p>
                </div>
        
                <div class="flex flex-wrap items-center gap-2">
                    <button id="printBtn"
                        class="rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">
                        Yazdır
                    </button>
                    <button id="csvBtn"
                        class="rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">
                        CSV İndir
                    </button>
                    <button id="excelBtn"
                        class="rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white hover:bg-slate-800">
                        Excel İndir
                    </button>
                </div>
            </div>
        
            <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
    <fieldset class="d360-field relative">
        <legend>Satıcı</legend>
    
        <input id="sellerSearch" type="text" class="d360-input" placeholder="Satıcı adı yazın" autocomplete="off" />
    
        <input id="sellerId" type="hidden" />
    
        <div id="sellerDropdown"
            class="absolute left-0 right-0 top-[calc(100%+8px)] z-30 hidden max-h-64 overflow-y-auto rounded-2xl border border-slate-200 bg-white p-2 shadow-xl">
        </div>
    </fieldset>
        
                    <fieldset class="d360-field">
                        <legend>Başlangıç Tarihi</legend>
                        <input id="fromDate" type="date" class="d360-input" />
                    </fieldset>
        
                    <fieldset class="d360-field">
                        <legend>Bitiş Tarihi</legend>
                        <input id="toDate" type="date" class="d360-input" />
                    </fieldset>
        
                    <div class="flex items-end">
                        <button id="filterBtn"
                            class="w-full rounded-xl bg-slate-900 px-4 py-3 text-sm font-semibold text-white hover:bg-slate-800">
                            Raporu Getir
                        </button>
                    </div>
                </div>
            </section>
        
            <section class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-4 mb-6">
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
                    <p class="text-xs text-slate-500">Kayıt</p>
                    <p id="entryCountText" class="mt-1 text-xl font-bold">0</p>
                </div>
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
                    <p class="text-xs text-slate-500">Toplam Kasa</p>
                    <p id="totalBoxesText" class="mt-1 text-xl font-bold">0</p>
                </div>
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
                    <p class="text-xs text-slate-500">Toplam Kilo</p>
                    <p id="totalWeightText" class="mt-1 text-xl font-bold">0.00</p>
                </div>
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
                    <p class="text-xs text-slate-500">Toplam Tutar</p>
                    <p id="totalAmountText" class="mt-1 text-xl font-bold">0.00 ₺</p>
                </div>
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
                    <p class="text-xs text-slate-500">Kalan</p>
                    <p id="totalRemainingText" class="mt-1 text-xl font-bold">0.00 ₺</p>
                </div>
            </section>
        
            <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
                <div class="overflow-x-auto">
                    <table class="min-w-full text-sm">
                        <thead>
                            <tr class="border-b border-slate-200 text-left text-slate-500">
                                <th class="py-3 pr-4">Tarih</th>
                                <th class="py-3 pr-4">Alıcı</th>
                                <th class="py-3 pr-4">Ürün</th>
                                <th class="py-3 pr-4">Kasa</th>
                                <th class="py-3 pr-4">Kilo</th>
                                <th class="py-3 pr-4">Birim Fiyat</th>
                                <th class="py-3 pr-4">Toplam</th>
                                <th class="py-3 pr-4">Ödenen</th>
                                <th class="py-3 pr-4">Kalan</th>
                                <th class="py-3 pr-4">Durum</th>
                            </tr>
                        </thead>
                        <tbody id="reportTableBody"></tbody>
                    </table>
                </div>
            </section>
        </div>
                   
                </main>
            </div>
        </div>
    </div>


    <script src="/assets/js/pages/seller-report.js"></script>
    <script src="/assets/js/toast.js"></script>
    <script src="/assets/js/layout.js"></script>
    
</body>

</html>
